###############################################################################
# docker-compose.override.yml — Overrides para desarrollo local
#
# Este archivo se aplica AUTOMÁTICAMENTE sobre docker-compose.yml cuando
# se corre `docker compose up` (Docker Compose lo detecta por nombre).
#
# Agrega: hot reload, montaje de código fuente, modo debug.
#
# C-19-fix-dev-setup:
#   - El web service ignora el bind-mount de node_modules del host y
#     corre `npm ci` adentro del contenedor para instalar las deps con
#     los binarios nativos del OS del contenedor (linux-x64-gnu). Esto
#     evita el bug "Cannot find module @rollup/rollup-linux-x64-gnu"
#     que aparece cuando el host es Windows y los binarios nativos no
#     matchean. Trade-off: cada --build reinstala todo (~30-60s la
#     primera vez; los siguientes cachean la capa de npm ci).
#   - El api corre `alembic upgrade head` antes de uvicorn para que la
#     DB esté migrada en un `docker compose up -d --build` desde cero.
#
#   Implementación: el bind-mount de node_modules se mantiene (sigue
#   siendo útil como fallback y para mantener el dev loop conocido),
#   pero el command hace `rm -rf /app/node_modules` antes de `npm ci`
#   para que las opcionales del host (Windows) no contaminen la
#   instalación del contenedor (Linux). El segundo bind-mount
#   declarado con `:ro` se ignora porque ya removimos el contenido.
#
#   NOTA: la opción "remover el bind-mount" del proposal original NO
#   funciona con el Dockerfile actual: el target `dev` no corre
#   `npm ci` (solo el target `builder`), por lo que sin el bind-mount
#   el contenedor no tiene vite ni node_modules en absoluto. La opción
#   "rm + npm ci dentro del contenedor" es la única viable con
#   docker-compose-only changes (cambiar el Dockerfile sería una
#   modificación del subrepo web).
#
# C-40-dev-setup-lint-guard:
#   El target `dev` del Dockerfile de facturas-proveedores-web no tiene
#   NINGÚN `COPY` (solo el target `builder` copia fuentes). Por lo tanto
#   `/app` dentro del contenedor `web` es EXACTAMENTE el conjunto de
#   `volumes:` declarado abajo, más el `node_modules` que instala el
#   `npm ci` del `command:`. Cualquier path que un quality gate del
#   frontend necesite leer y no esté en `volumes:` es invisible dentro
#   del contenedor, de forma permanente (no es un problema de imagen
#   vieja).
#
#   REGLA: toda vez que se agregue un archivo de configuración raíz
#   nuevo (ej. un futuro tailwind.config.js) o un nuevo directorio de
#   tests, hay que agregarlo explícitamente a `volumes:` del servicio
#   `web`, o el guard correspondiente quedará "coleccionado" en el
#   repo pero nunca ejecutado dentro del contenedor — exactamente el
#   bug que este change corrigió para `eslint.config.js` y `tests/`.
#
#   Los cambios de `volumes:` requieren `docker compose up -d` (recrea
#   el contenedor); un `restart` NO alcanza porque no vuelve a leer el
#   compose file.
###############################################################################

services:

  # ── Backend con hot reload ───────────────────────────────────────────────────
  api:
    build:
      target: runtime          # mismo target, pero con código montado
    command:
      # C-19: migraciones antes de uvicorn. Si alembic falla, uvicorn
      # no arranca → docker ps muestra "unhealthy" → el team lo ve.
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    volumes:
      # Montar código fuente para hot reload sin rebuild
      - ./facturas-proveedores-api/app:/app/app:ro
      - ./facturas-proveedores-api/tests:/app/tests:ro
      - ./facturas-proveedores-api/alembic:/app/alembic:ro
      - ./facturas-proveedores-api/alembic.ini:/app/alembic.ini:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── Frontend con hot reload ──────────────────────────────────────────────────
  web:
    build:
      target: dev
    command:
      # C-19: eliminar el bind-mount de node_modules y reinstalar
      # adentro. Los binarios nativos (rollup-linux-x64-gnu,
      # esbuild-linux-x64, @tailwindcss/oxide-linux-x64-gnu, etc.)
      # se compilan para el OS del contenedor, no del host. Si el
      # host es Windows, los binarios del host (rollup-win32-...)
      # no sirven. `npm ci` respeta el lockfile y es idempotente
      # en cada arranque (los node_modules persisten en una capa
      # de Docker, no en el bind-mount).
      - sh
      - -c
      - "rm -rf /app/node_modules && npm ci --prefer-offline --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      # Montar código fuente desde host para hot reload
      - ./facturas-proveedores-web/src:/app/src:ro
      - ./facturas-proveedores-web/public:/app/public:ro
      - ./facturas-proveedores-web/index.html:/app/index.html:ro
      - ./facturas-proveedores-web/vite.config.ts:/app/vite.config.ts:ro
      - ./facturas-proveedores-web/tsconfig.json:/app/tsconfig.json:ro
      - ./facturas-proveedores-web/package.json:/app/package.json:ro
      # package-lock.json es necesario para `npm ci`. NO se monta
      # node_modules: se borra y se reinstala dentro del contenedor.
      - ./facturas-proveedores-web/package-lock.json:/app/package-lock.json:ro
      # C-40: sin este mount, `npm run lint` no puede resolver su
      # configuración dentro del contenedor (ESLint couldn't find an
      # eslint.config.js file).
      - ./facturas-proveedores-web/eslint.config.js:/app/eslint.config.js:ro
      # C-40: sin este mount, Vitest no colecciona ningún archivo de
      # este directorio y los regression-guards que viven ahí
      # (frontend-lint.test.ts, design-system-guard.test.ts) quedan
      # invisibles para la suite del contenedor.
      - ./facturas-proveedores-web/tests:/app/tests:ro
    environment:
      VITE_API_URL: http://api:8000

  # ── Base de datos sin restricción de puerto para tools locales ───────────────
  db:
    ports:
      - "5432:5432"    # accesible desde DBeaver/TablePlus en el host
