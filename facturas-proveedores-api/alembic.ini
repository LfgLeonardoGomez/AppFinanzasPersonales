# Alembic Configuration File
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# La URL se SOBREESCRIBE en env/alembic con get_url() desde la variable de entorno.
# Este valor es un placeholder — nunca se usa directamente.
# Ver: alembic/env.py
script_location = alembic

# Plantilla para nombres de archivos de revisión
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone para los timestamps de migración
timezone = UTC

# Prepend sys.path con el directorio actual para importar app.*
prepend_sys_path = .

# Revisión inicial para `alembic upgrade head` en DB vacía
# revision_environment = false

# Soporte para múltiples heads (false por defecto)
# sourceless = false

# Directorio de outputs (opcional)
# output_encoding = utf-8

[post_write_hooks]
# Hooks de post-escritura (ej. formatear con black)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
