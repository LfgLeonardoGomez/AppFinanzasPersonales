<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #7c3aed; text-decoration: none; }
  a:hover { color: #6d28d9; }
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:56px;padding:56px;background:#f2f0ec;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;min-height:100vh;box-sizing:border-box;">

  <div style="display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a8598;">Pagos — Desktop</span>
    <div style="width:1040px;display:flex;flex-direction:column;gap:20px;">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <a href="Home.dc.html" style="font-size:12.5px;font-weight:600;color:#8a8598;align-self:center;">← Home</a>
        <h1 style="margin:0;font-size:24px;font-weight:700;color:#18151f;letter-spacing:-0.01em;flex:1;">Pagos</h1>
        <a href="Carga%20IA.dc.html" style="border:none;background:#7c3aed;color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:999px;cursor:pointer;font-family:inherit;">+ Registrar pago</a>
      </div>

      <div style="background:#fdfcfb;border:1px solid #eeece7;border-radius:16px;padding:8px 20px;">
        <div style="display:flex;flex-direction:column;">
          <sc-for list="{{ pagos }}" as="p" hint-placeholder-count="6">
            <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid #f1efe9;">
              <div style="width:34px;height:34px;border-radius:10px;background:{{ p.chipBg }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:{{ p.chipColor }};flex-shrink:0;">{{ p.initial }}</div>
              <div style="flex:1;min-width:0;">
                <p style="margin:0;font-size:13.5px;font-weight:600;color:#18151f;">{{ p.proveedor }}</p>
                <p style="margin:1px 0 0 0;font-size:12px;color:#8a8598;">{{ p.medio }} · {{ p.fecha }}</p>
              </div>
              <p style="margin:0;font-size:13.5px;font-weight:700;color:#059669;flex-shrink:0;">-{{ p.monto }}</p>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a8598;">Pagos — Mobile</span>
    <div style="width:390px;height:844px;background:#fdfcfb;border-radius:36px;box-shadow:0 1px 2px rgba(24,21,31,0.04), 0 24px 64px rgba(24,21,31,0.14);overflow:hidden;display:flex;flex-direction:column;">

      <div style="padding:20px 20px 0 20px;flex-shrink:0;">
        <a href="Home.dc.html" style="font-size:12px;font-weight:600;color:#8a8598;">← Home</a>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
          <h1 style="margin:0;font-size:19px;font-weight:700;color:#18151f;letter-spacing:-0.01em;">Pagos</h1>
          <a href="Carga%20IA.dc.html" style="border:none;background:#7c3aed;color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;font-family:inherit;">+ Pago</a>
        </div>
      </div>

      <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px 18px 20px;display:flex;flex-direction:column;">
        <sc-for list="{{ pagos }}" as="p" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #f1efe9;">
            <div style="width:32px;height:32px;border-radius:9px;background:{{ p.chipBg }};display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:{{ p.chipColor }};flex-shrink:0;">{{ p.initial }}</div>
            <div style="flex:1;min-width:0;">
              <p style="margin:0;font-size:13px;font-weight:600;color:#18151f;">{{ p.proveedor }}</p>
              <p style="margin:1px 0 0 0;font-size:11px;color:#8a8598;">{{ p.medio }} · {{ p.fecha }}</p>
            </div>
            <p style="margin:0;font-size:13px;font-weight:700;color:#059669;flex-shrink:0;">-{{ p.monto }}</p>
          </div>
        </sc-for>
      </div>

      <div style="flex-shrink:0;border-top:1px solid #eeece7;background:#fdfcfb;padding:10px 12px 18px 12px;display:flex;justify-content:space-around;">
        <sc-for list="{{ tabItems }}" as="t" hint-placeholder-count="5">
          <a href="{{ t.href }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:7px;height:7px;border-radius:2px;background:{{ t.color }};"></div>
            <span style="font-size:10.5px;font-weight:600;color:{{ t.textColor }};">{{ t.label }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const pagos = [
      { initial: 'DN', proveedor: 'Distribuidora Norte', medio: 'Transferencia', fecha: '05/07/2026', monto: '$64.200', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'TL', proveedor: 'TransLog', medio: 'Transferencia', fecha: '20/06/2026', monto: '$41.000', chipBg: '#fdeaf4', chipColor: '#d6409f' },
      { initial: 'ES', proveedor: 'ElectroSur SRL', medio: 'Efectivo', fecha: '15/06/2026', monto: '$18.000', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'PM', proveedor: 'Papelera Moreno', medio: 'Transferencia', fecha: '02/06/2026', monto: '$9.400', chipBg: '#fdeaf4', chipColor: '#d6409f' },
      { initial: 'IG', proveedor: 'Insumos García', medio: 'Cheque', fecha: '28/05/2026', monto: '$22.500', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
    ];
    const tabItems = [
      { label: 'Home', color: '#d8d3e6', textColor: '#8a8598', href: 'Home.dc.html' },
      { label: 'Proveed.', color: '#d8d3e6', textColor: '#8a8598', href: 'Listado Proveedores.dc.html' },
      { label: 'Facturas', color: '#d8d3e6', textColor: '#8a8598', href: 'Listado Facturas.dc.html' },
      { label: 'Pagos', color: '#7c3aed', textColor: '#4c1d95', href: 'Listado Pagos.dc.html' },
      { label: 'Perfil', color: '#d8d3e6', textColor: '#8a8598', href: 'Perfil.dc.html' },
    ];
    return { pagos, tabItems };
  }
}

</script>
</body>
</html>
