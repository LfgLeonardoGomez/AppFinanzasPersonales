<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #7c3aed; text-decoration: none; }
  a:hover { color: #6d28d9; }
  input::placeholder { color: #b6b1c6; }
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:56px;padding:56px;background:#f2f0ec;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;min-height:100vh;box-sizing:border-box;">

  <div style="display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a8598;">Proveedores — Desktop</span>
    <div style="width:1040px;display:flex;flex-direction:column;gap:20px;">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <a href="Home.dc.html" style="font-size:12.5px;font-weight:600;color:#8a8598;align-self:center;">← Home</a>
        <h1 style="margin:0;font-size:24px;font-weight:700;color:#18151f;letter-spacing:-0.01em;flex:1;">Proveedores</h1>
        <a href="Proveedor%20Form.dc.html" style="border:none;background:#7c3aed;color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:999px;cursor:pointer;font-family:inherit;">+ Nuevo proveedor</a>
      </div>

      <div style="background:#fdfcfb;border:1px solid #eeece7;border-radius:14px;padding:4px 16px;display:flex;align-items:center;gap:10px;">
        <div style="width:14px;height:14px;border:1.8px solid #8a8598;border-radius:50%;flex-shrink:0;position:relative;"><div style="width:6px;height:1.8px;background:#8a8598;position:absolute;top:14px;left:11px;transform:rotate(45deg);"></div></div>
        <input placeholder="Buscar proveedor por nombre o CUIT" style="flex:1;border:none;outline:none;padding:13px 0;font-size:13.5px;font-family:inherit;color:#18151f;background:transparent;" />
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
        <sc-for list="{{ proveedores }}" as="p" hint-placeholder-count="6">
          <div style="background:#fdfcfb;border:1px solid #eeece7;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;">
            <a href="Detalle%20Proveedor.dc.html" style="display:flex;align-items:center;gap:10px;">
              <div style="width:36px;height:36px;border-radius:10px;background:{{ p.chipBg }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:{{ p.chipColor }};flex-shrink:0;">{{ p.initial }}</div>
              <div style="min-width:0;">
                <p style="margin:0;font-size:13.5px;font-weight:600;color:#18151f;">{{ p.nombre }}</p>
                <p style="margin:1px 0 0 0;font-size:11.5px;color:#8a8598;">{{ p.cuit }}</p>
              </div>
            </a>
            <div>
              <p style="margin:0;font-size:10.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#8a8598;">Saldo</p>
              <p style="margin:2px 0 0 0;font-size:16px;font-weight:700;color:{{ p.saldoColor }};">{{ p.saldo }}</p>
            </div>
            <div style="display:flex;gap:8px;">
              <a href="Carga%20IA.dc.html" style="flex:1;text-align:center;border:1px solid #e4e0f0;background:#faf9fd;color:#4c1d95;font-size:12px;font-weight:600;padding:8px 0;border-radius:999px;cursor:pointer;font-family:inherit;">Factura</a>
              <a href="Carga%20IA.dc.html" style="flex:1;text-align:center;border:1px solid #e4e0f0;background:#faf9fd;color:#4c1d95;font-size:12px;font-weight:600;padding:8px 0;border-radius:999px;cursor:pointer;font-family:inherit;">Pago</a>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a8598;">Proveedores — Mobile</span>
    <div style="width:390px;height:844px;background:#fdfcfb;border-radius:36px;box-shadow:0 1px 2px rgba(24,21,31,0.04), 0 24px 64px rgba(24,21,31,0.14);overflow:hidden;display:flex;flex-direction:column;">

      <div style="padding:20px 20px 0 20px;flex-shrink:0;">
        <a href="Home.dc.html" style="font-size:12px;font-weight:600;color:#8a8598;">← Home</a>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
          <h1 style="margin:0;font-size:19px;font-weight:700;color:#18151f;letter-spacing:-0.01em;">Proveedores</h1>
          <a href="Proveedor%20Form.dc.html" style="border:none;background:#7c3aed;color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;font-family:inherit;">+ Nuevo</a>
        </div>
      </div>

      <div style="padding:14px 20px 0 20px;flex-shrink:0;">
        <div style="background:#f2f0ec;border-radius:12px;padding:2px 14px;display:flex;align-items:center;gap:8px;">
          <div style="width:13px;height:13px;border:1.6px solid #8a8598;border-radius:50%;flex-shrink:0;position:relative;"><div style="width:5px;height:1.6px;background:#8a8598;position:absolute;top:13px;left:10px;transform:rotate(45deg);"></div></div>
          <input placeholder="Buscar proveedor" style="flex:1;border:none;outline:none;padding:11px 0;font-size:13px;font-family:inherit;color:#18151f;background:transparent;" />
        </div>
      </div>

      <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px 18px 20px;display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{ proveedores }}" as="p" hint-placeholder-count="6">
          <div style="background:#fff;border:1px solid #eeece7;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
            <a href="Detalle%20Proveedor.dc.html" style="display:flex;align-items:center;gap:10px;">
              <div style="width:34px;height:34px;border-radius:10px;background:{{ p.chipBg }};display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:{{ p.chipColor }};flex-shrink:0;">{{ p.initial }}</div>
              <div style="min-width:0;flex:1;">
                <p style="margin:0;font-size:13.5px;font-weight:600;color:#18151f;">{{ p.nombre }}</p>
                <p style="margin:1px 0 0 0;font-size:11px;color:#8a8598;">{{ p.cuit }}</p>
              </div>
              <p style="margin:0;font-size:14px;font-weight:700;color:{{ p.saldoColor }};flex-shrink:0;">{{ p.saldo }}</p>
            </a>
            <div style="display:flex;gap:8px;">
              <a href="Carga%20IA.dc.html" style="flex:1;text-align:center;border:1px solid #e4e0f0;background:#faf9fd;color:#4c1d95;font-size:12px;font-weight:600;padding:8px 0;border-radius:999px;cursor:pointer;font-family:inherit;">Factura</a>
              <a href="Carga%20IA.dc.html" style="flex:1;text-align:center;border:1px solid #e4e0f0;background:#faf9fd;color:#4c1d95;font-size:12px;font-weight:600;padding:8px 0;border-radius:999px;cursor:pointer;font-family:inherit;">Pago</a>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="flex-shrink:0;border-top:1px solid #eeece7;background:#fdfcfb;padding:10px 12px 18px 12px;display:flex;justify-content:space-around;">
        <sc-for list="{{ tabItems }}" as="t" hint-placeholder-count="5">
          <a href="{{ t.href }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:7px;height:7px;border-radius:2px;background:{{ t.color }};"></div>
            <span style="font-size:10.5px;font-weight:600;color:{{ t.textColor }};">{{ t.label }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const proveedores = [
      { initial: 'DN', nombre: 'Distribuidora Norte', cuit: '30-71234567-8', saldo: '$128.400', saldoColor: '#dc2626', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'ES', nombre: 'ElectroSur SRL', cuit: '30-70988112-3', saldo: '$0', saldoColor: '#18151f', chipBg: '#fdeaf4', chipColor: '#d6409f' },
      { initial: 'IG', nombre: 'Insumos García', cuit: '27-33445566-1', saldo: '$12.300', saldoColor: '#dc2626', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'TL', nombre: 'TransLog', cuit: '30-69887744-5', saldo: '$0', saldoColor: '#18151f', chipBg: '#fdeaf4', chipColor: '#d6409f' },
      { initial: 'PM', nombre: 'Papelera Moreno', cuit: '30-65221199-0', saldo: '$5.600', saldoColor: '#dc2626', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'RC', nombre: 'Repuestos Cba', cuit: '20-31122334-7', saldo: '$0', saldoColor: '#18151f', chipBg: '#fdeaf4', chipColor: '#d6409f' },
    ];
    const tabItems = [
      { label: 'Home', color: '#d8d3e6', textColor: '#8a8598', href: 'Home.dc.html' },
      { label: 'Proveed.', color: '#7c3aed', textColor: '#4c1d95', href: 'Listado Proveedores.dc.html' },
      { label: 'Facturas', color: '#d8d3e6', textColor: '#8a8598', href: 'Listado Facturas.dc.html' },
      { label: 'Pagos', color: '#d8d3e6', textColor: '#8a8598', href: 'Listado Pagos.dc.html' },
      { label: 'Perfil', color: '#d8d3e6', textColor: '#8a8598', href: 'Perfil.dc.html' },
    ];
    return { proveedores, tabItems };
  }
}

</script>
</body>
</html>
