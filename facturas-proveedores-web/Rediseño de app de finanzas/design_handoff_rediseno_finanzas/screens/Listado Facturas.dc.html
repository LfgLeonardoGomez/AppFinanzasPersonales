<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #7c3aed; text-decoration: none; }
  a:hover { color: #6d28d9; }
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:56px;padding:56px;background:#f2f0ec;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;min-height:100vh;box-sizing:border-box;">

  <div style="display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a8598;">Facturas — Desktop</span>
    <div style="width:1040px;display:flex;flex-direction:column;gap:20px;">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <a href="Home.dc.html" style="font-size:12.5px;font-weight:600;color:#8a8598;align-self:center;">← Home</a>
        <h1 style="margin:0;font-size:24px;font-weight:700;color:#18151f;letter-spacing:-0.01em;flex:1;">Facturas</h1>
        <a href="Carga%20IA.dc.html" style="border:none;background:#7c3aed;color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:999px;cursor:pointer;font-family:inherit;">+ Cargar factura</a>
      </div>

      <div style="display:flex;gap:8px;">
        <sc-for list="{{ filtros }}" as="f" hint-placeholder-count="4">
          <button style="border:1px solid #e4e0f0;background:{{ f.bg }};color:{{ f.color }};font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit;">{{ f.label }}</button>
        </sc-for>
      </div>

      <div style="background:#fdfcfb;border:1px solid #eeece7;border-radius:16px;padding:8px 20px;">
        <div style="display:flex;flex-direction:column;">
          <sc-for list="{{ facturas }}" as="f" hint-placeholder-count="6">
            <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid #f1efe9;">
              <div style="width:34px;height:34px;border-radius:10px;background:{{ f.chipBg }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:{{ f.chipColor }};flex-shrink:0;">{{ f.initial }}</div>
              <div style="flex:1;min-width:0;">
                <p style="margin:0;font-size:13.5px;font-weight:600;color:#18151f;">{{ f.proveedor }}</p>
                <p style="margin:1px 0 0 0;font-size:12px;color:#8a8598;">N.° {{ f.numero }} · {{ f.fecha }}</p>
              </div>
              <span style="font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:{{ f.estadoBg }};color:{{ f.estadoColor }};flex-shrink:0;">{{ f.estado }}</span>
              <p style="margin:0;font-size:13.5px;font-weight:700;color:#18151f;flex-shrink:0;width:90px;text-align:right;">{{ f.monto }}</p>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a8598;">Facturas — Mobile</span>
    <div style="width:390px;height:844px;background:#fdfcfb;border-radius:36px;box-shadow:0 1px 2px rgba(24,21,31,0.04), 0 24px 64px rgba(24,21,31,0.14);overflow:hidden;display:flex;flex-direction:column;">

      <div style="padding:20px 20px 0 20px;flex-shrink:0;">
        <a href="Home.dc.html" style="font-size:12px;font-weight:600;color:#8a8598;">← Home</a>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
          <h1 style="margin:0;font-size:19px;font-weight:700;color:#18151f;letter-spacing:-0.01em;">Facturas</h1>
          <a href="Carga%20IA.dc.html" style="border:none;background:#7c3aed;color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;font-family:inherit;">+ Cargar</a>
        </div>
      </div>

      <div style="padding:14px 20px 0 20px;flex-shrink:0;display:flex;gap:8px;overflow-x:auto;">
        <sc-for list="{{ filtros }}" as="f" hint-placeholder-count="4">
          <button style="border:1px solid #e4e0f0;background:{{ f.bg }};color:{{ f.color }};font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">{{ f.label }}</button>
        </sc-for>
      </div>

      <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px 18px 20px;display:flex;flex-direction:column;">
        <sc-for list="{{ facturas }}" as="f" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #f1efe9;">
            <div style="width:32px;height:32px;border-radius:9px;background:{{ f.chipBg }};display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:{{ f.chipColor }};flex-shrink:0;">{{ f.initial }}</div>
            <div style="flex:1;min-width:0;">
              <p style="margin:0;font-size:13px;font-weight:600;color:#18151f;">{{ f.proveedor }}</p>
              <p style="margin:1px 0 0 0;font-size:11px;color:#8a8598;">{{ f.fecha }}</p>
              <span style="display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:{{ f.estadoBg }};color:{{ f.estadoColor }};">{{ f.estado }}</span>
            </div>
            <p style="margin:0;font-size:13px;font-weight:700;color:#18151f;flex-shrink:0;">{{ f.monto }}</p>
          </div>
        </sc-for>
      </div>

      <div style="flex-shrink:0;border-top:1px solid #eeece7;background:#fdfcfb;padding:10px 12px 18px 12px;display:flex;justify-content:space-around;">
        <sc-for list="{{ tabItems }}" as="t" hint-placeholder-count="5">
          <a href="{{ t.href }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:7px;height:7px;border-radius:2px;background:{{ t.color }};"></div>
            <span style="font-size:10.5px;font-weight:600;color:{{ t.textColor }};">{{ t.label }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const filtros = [
      { label: 'Todas', bg: '#7c3aed', color: '#fff' },
      { label: 'Pendientes', bg: '#fff', color: '#5b5670' },
      { label: 'Parciales', bg: '#fff', color: '#5b5670' },
      { label: 'Pagadas', bg: '#fff', color: '#5b5670' },
    ];
    const facturas = [
      { initial: 'DN', proveedor: 'Distribuidora Norte', numero: '0001-000482', fecha: '14/07/2026', monto: '$128.400', estado: 'Pendiente', estadoBg: '#fef3c7', estadoColor: '#92400e', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'IG', proveedor: 'Insumos García', numero: '0002-000119', fecha: '12/07/2026', monto: '$12.300', estado: 'Pendiente', estadoBg: '#fef3c7', estadoColor: '#92400e', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'ES', proveedor: 'ElectroSur SRL', numero: '0004-000330', fecha: '05/07/2026', monto: '$64.200', estado: 'Pagada', estadoBg: '#ecfdf5', estadoColor: '#065f46', chipBg: '#fdeaf4', chipColor: '#d6409f' },
      { initial: 'PM', proveedor: 'Papelera Moreno', numero: '0001-000091', fecha: '30/06/2026', monto: '$5.600', estado: 'Parcial', estadoBg: '#fdeaf4', estadoColor: '#9d174d', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'DN', proveedor: 'Distribuidora Norte', numero: '0001-000471', fecha: '02/07/2026', monto: '$64.200', estado: 'Pagada', estadoBg: '#ecfdf5', estadoColor: '#065f46', chipBg: '#f2ecfd', chipColor: '#7c3aed' },
      { initial: 'TL', proveedor: 'TransLog', numero: '0003-000208', fecha: '19/06/2026', monto: '$41.000', estado: 'Pagada', estadoBg: '#ecfdf5', estadoColor: '#065f46', chipBg: '#fdeaf4', chipColor: '#d6409f' },
    ];
    const tabItems = [
      { label: 'Home', color: '#d8d3e6', textColor: '#8a8598', href: 'Home.dc.html' },
      { label: 'Proveed.', color: '#d8d3e6', textColor: '#8a8598', href: 'Listado Proveedores.dc.html' },
      { label: 'Facturas', color: '#7c3aed', textColor: '#4c1d95', href: 'Listado Facturas.dc.html' },
      { label: 'Pagos', color: '#d8d3e6', textColor: '#8a8598', href: 'Listado Pagos.dc.html' },
      { label: 'Perfil', color: '#d8d3e6', textColor: '#8a8598', href: 'Perfil.dc.html' },
    ];
    return { filtros, facturas, tabItems };
  }
}

</script>
</body>
</html>
